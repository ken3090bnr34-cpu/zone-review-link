<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zone Review">
<link rel="apple-touch-icon" href="icon.png">
<title>Zone Review</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
main{width:min(420px,100%);text-align:center;padding:28px 22px;background:#101820;border:1px solid #263747;border-radius:20px;box-shadow:0 18px 60px rgba(0,0,0,.28)}
.logo{width:72px;height:72px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(145deg,#122434,#172f42);border:1px solid #385772;font-weight:900;font-size:24px;color:#67c7ff}
h2{margin:0 0 12px;font-size:24px}.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:8px}
p{line-height:1.55;color:#c6d2dc}small{color:#8b98a5;line-height:1.5;display:block}
.steps{display:none;text-align:left;margin:20px 0 4px;padding:16px 18px;background:#0b1219;border:1px solid #263747;border-radius:14px;line-height:1.7;color:#dbe6ee}
.steps b{color:#fff}.btn{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;font-weight:800;background:#285f87;color:#fff;font-size:15px}
</style></head><body><main>
<div class="logo">ZR</div>
<h2><span class="dot"></span>XAUUSD Zone Review</h2>
<p id="status">安全な接続先を確認しています…</p>
<div id="steps" class="steps"><b>iPhoneホーム画面への追加</b><br>1. Safari下部の「共有」ボタン<br>2. 「ホーム画面に追加」<br>3. 右上の「追加」</div>
<small id="note">接続情報は暗号化されています。</small>
<button id="open" class="btn" hidden>今すぐZone Reviewを開く</button>
<button id="retry" class="btn" hidden onclick="location.reload()">再試行</button>
</main><script>const statusEl=document.getElementById('status'),retry=document.getElementById('retry'),openBtn=document.getElementById('open'),steps=document.getElementById('steps'),note=document.getElementById('note');
const qs=new URLSearchParams(location.search);
const installMode=qs.get('install')==='1';
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function go(){try{
 const keyText=location.hash.slice(1); if(!keyText) throw Error('access key missing');
 const payload=await fetch('https://raw.githubusercontent.com/ken3090bnr34-cpu/zone-review-link/main/target.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('locator unavailable');return r.json()});
 const key=await crypto.subtle.importKey('raw',b64u(keyText),{name:'AES-GCM'},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(payload.iv)},key,b64u(payload.data));
 const target=new TextDecoder().decode(plain);
 if(!target.startsWith('https://')) throw Error('invalid target');
 statusEl.textContent='Zone Reviewへ接続しています…';
 location.replace(target);
}catch(e){statusEl.textContent='接続先を取得できません。Macがオンラインか確認してください。';retry.hidden=false}}
if(installMode&&!standalone){
 statusEl.textContent='このページをiPhoneのホーム画面に追加してください。';
 steps.style.display='block';
 note.textContent='追加後のアイコンは、接続先が変わっても同じまま使えます。';
 openBtn.hidden=false; openBtn.onclick=go;
}else{go()}
</script></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Zone Review</title>
<style>
body{margin:0;background:#0b0f14;color:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;min-height:100vh}
main{text-align:center;padding:28px}.dot{width:12px;height:12px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:8px}
small{color:#8b98a5}button{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;font-weight:700}
</style></head><body><main>
<h2><span class="dot"></span>XAUUSD Zone Review</h2>
<p id="status">安全な接続先を確認しています…</p>
<small>接続情報は暗号化されています。</small><br>
<button id="retry" hidden onclick="location.reload()">再試行</button>
</main><script>
const statusEl=document.getElementById('status'), retry=document.getElementById('retry');
function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function go(){try{
 const keyText=location.hash.slice(1); if(!keyText) throw Error('access key missing');
 const payload=await fetch('target.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('locator unavailable');return r.json()});
 const key=await crypto.subtle.importKey('raw',b64u(keyText),{name:'AES-GCM'},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(payload.iv)},key,b64u(payload.data));
 const target=new TextDecoder().decode(plain);
 if(!target.startsWith('https://')) throw Error('invalid target');
 statusEl.textContent='Zone Reviewへ接続しています…'; location.replace(target);
}catch(e){statusEl.textContent='接続先を取得できません。Macがオンラインか確認してください。';retry.hidden=false}}
go();
</script></body></html>
